<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | White Water Rafting</title>
  <meta name="description" content="Get in touch with White Water Rafting. Find our office address, phone number, email, meet our friendly team, and send us a message.">
  <meta name="author" content="Freddy Tueros">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>

  <header>
    <img src="images/logo.jpg" alt="Rafting Company Logo" class="logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Contact Us</h1>


    <section class="company-info">
      <div class="contact-details">
        <h2>Company Information</h2>
        <p><strong>Address:</strong> 123 Rapids Way, Salmon River, ID 83201</p>
        <p><strong>Phone:</strong> (208) 555-0199</p>
        <p><strong>Email:</strong> info@whitewaterrafting.com</p>
      </div>
      <div class="map-container">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d184752.48378943714!2d-111.91689498263158!3d43.82538198762744!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53540b03b223c6f9%3A0xb36618580004fb49!2sRexburg%2C%20ID!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus" 
          width="100%" 
          height="250" 
          style="border:0;" 
          allowfullscreen="" 
          loading="lazy" 
          referrerpolicy="no-referrer-when-downgrade"
          title="White Water Rafting Office Location">
        </iframe>
      </div>
    </section>


    <section class="employees">
      <h2>Meet Our Team</h2>
      <div class="employee-grid">
        <figure>
          <img src="images/employee1.jpg" alt="Sarah Jenkins, Head River Guide">
          <figcaption>Abigail Zavala<br><span>Head River Guide</span></figcaption>
        </figure>
        <figure>
          <img src="images/employee2.jpg" alt="Carlos Ruiz, Safety Coordinator">
          <figcaption>Carlos Ruiz<br><span>Safety Coordinator</span></figcaption>
        </figure>
        <figure>
          <img src="images/employee3.jpg" alt="Emma Miller, Customer Support">
          <figcaption>Emma Miller<br><span>Reservations Manager</span></figcaption>
        </figure>
      </div>
    </section>

    <section class="contact-form-section">
      <h2>Send Us a Message</h2>
      <form action="#" method="post">
        <div class="form-item">
          <label for="username">Full Name:</label>
          <input type="text" id="username" name="username" required>
        </div>

        <div class="form-item">
          <label for="useremail">Email Address:</label>
          <input type="email" id="useremail" name="useremail" required>
        </div>

        <div class="form-item">
          <label for="purpose">Message Purpose:</label>
          <select id="purpose" name="purpose" required>
            <option value="">Select an option</option>
            <option value="general">General Inquiry</option>
            <option value="reservation">Reservation Question</option>
            <option value="feedback">Website Feedback</option>
          </select>
        </div>

        <div class="form-item">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <div class="form-checkbox">
          <input type="checkbox" id="newsletter" name="newsletter">
          <label for="newsletter">Please subscribe me to the monthly newsletter</label>
        </div>

        <!-- Botón que no dice solo Submit -->
        <button type="submit" class="submit-btn">Send Your Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 White Water Rafting | Freddy Tueros</p>

    <nav class="socialmedia">
      <a href="https://facebook.com" target="_blank"><img src="images/facebook.png" alt="Facebook icon"></a>
      <a href="https://twitter.com" target="_blank"><img src="images/twitter.png" alt="Twitter icon"></a>
      <a href="https://instagram.com" target="_blank"><img src="images/instagram.png" alt="Instagram icon"></a>
    </nav>
  </footer>
</body>
</html>
